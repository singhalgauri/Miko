# Owner: Shared (P1 / P2 / P3 / P4)
# Purpose: Python project configuration and dependency management for Miko backend
# TODO: Pin production lockfile versions

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miko-backend"
version = "0.1.0"
description = "Miko: A free, local-first, always-on AI agent"
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Miko Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "openai>=1.14.0",
    "ollama>=0.1.7",
    "typing-extensions>=4.10.0"
]

[project.optional-dependencies]
rag = [
    "PyMuPDF>=1.23.0",
    "sqlite-vec>=0.1.1"
]
graphs = [
    "langgraph>=0.0.30"
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
